# Netlify 배포 설정 — 2027 GS25 상품전략공유회
#
# ⚠️ 이 파일은 반드시 **저장소 최상위**에 있어야 한다.
#    앱이 gs25-expo-2027/ 안에 있으므로 base 로 지정한다.
#    (앱 폴더 안에 두면 Netlify 가 읽지 못해 빈 사이트가 배포되고 404 가 뜬다)

[build]
  # 빌드 전에 이 디렉터리로 이동한다. npm install · npm run build 가 여기서 실행된다.
  base = "gs25-expo-2027"
  command = "npm run build"
  # Next.js 빌드 산출물. base 기준 상대경로이므로 gs25-expo-2027/.next 를 가리킨다.
  #
  # 반드시 명시해야 한다. 비워 두면 Netlify 가 publish 를 base 와 같게 잡는데,
  # Next.js Runtime 이 "publish directory cannot be the same as the base directory" 로 거부한다.
  # 이 경로는 Runtime 이 읽어 서버리스 함수와 정적 자산으로 변환한다(정적 노출이 아니다).
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  # 빌드 로그를 줄이고 설치 속도를 높인다
  NPM_FLAGS = "--no-audit --no-fund"

  # NEXT_PUBLIC_* 은 설계상 브라우저 번들에 포함되는 **공개값**이다.
  # Netlify 시크릿 스캐너는 이를 유출로 오인해 빌드를 막으므로 명시적으로 제외한다.
  # (진짜 비밀키 APPS_SCRIPT_KEY · PHONE_ENC_KEY · PHONE_HMAC_KEY 는 여기 넣지 않는다.
  #  그 값들은 저장소 어디에도 없어야 하고, 스캐너가 계속 감시해야 한다.)
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_FIREBASE_API_KEY,NEXT_PUBLIC_FIREBASE_APP_ID,NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN,NEXT_PUBLIC_FIREBASE_PROJECT_ID,NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET,NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID,NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID,NEXT_PUBLIC_APPCHECK_SITE_KEY,NEXT_PUBLIC_DEMO_MODE,NEXT_PUBLIC_OPEN_AT,NEXT_PUBLIC_TOUR_START_AT,NEXT_PUBLIC_CLOSE_AT"

# Next.js Runtime — 서버리스 함수(API Route · SSR)를 생성한다.
# 자동 감지에 맡기면 base 가 하위 디렉터리일 때 적용되지 않는 경우가 있어 명시한다.
# (package.json 에는 넣지 않는다. Netlify 가 설치·버전 관리를 맡는다)
[[plugins]]
  package = "@netlify/plugin-nextjs"

# 폐쇄형 플랫폼이므로 검색엔진을 전면 차단한다.
# (next.config.js 에도 같은 헤더가 있지만, 정적 자산 응답에도 확실히 붙이기 위해 둔다)
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive, nosnippet"

# Apps Script 트리거가 찾아오는 엔드포인트 · 콘텐츠 API — 캐시 금지
[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store, max-age=0"
